<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenEdu - Complete Computer Science Curriculum</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    /* Custom scrollbar for better look */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <nav class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3 cursor-pointer" onclick="resetFilters()">
        <div class="bg-indigo-600 p-2 rounded-lg text-white">
          <i data-lucide="library" class="w-6 h-6"></i>
        </div>
        <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
          CS OpenHub
        </span>
      </div>

      <div class="relative w-full md:w-1/2">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3.5 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="handleSearchInput()" 
               placeholder="Search by topic, university, or technology (e.g., 'Distributed Systems', 'CMU', 'Python')..." 
               class="w-full bg-slate-800 text-slate-200 border border-slate-700 rounded-full pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 transition">
      </div>
    </div>
  </nav>

  <header class="max-w-7xl mx-auto px-6 py-12 text-center relative overflow-hidden">
    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight mb-4">
      The Complete <span class="bg-gradient-to-r from-indigo-400 via-sky-400 to-emerald-400 bg-clip-text text-transparent">Computer Science</span> Catalog
    </h1>
    <p class="text-slate-400 max-w-2xl mx-auto text-base mb-8">
      A massive directory of world-class computer science courses. Master everything from discrete mathematics and algorithms to distributed systems and deep learning.
    </p>
    <div id="apiStatus" class="max-w-md mx-auto mb-6 hidden"></div>
  </header>

  <main class="max-w-7xl mx-auto px-6 pb-24" id="courses">
    
    <!-- Filter Toolbar -->
    <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 bg-slate-800/50 border border-slate-800 p-4 rounded-2xl mb-8">
      
      <div class="flex flex-wrap items-center gap-3 w-full xl:w-auto">
        <label class="text-xs uppercase tracking-wider font-semibold text-slate-400">Domain:</label>
        <select id="categoryFilter" onchange="handleCategoryChange()" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          <option value="All">All Domains</option>
          <option value="Computer Science Core">CS Core & Programming</option>
          <option value="Mathematics for CS">Mathematics for CS</option>
          <option value="Systems & Architecture">Systems & Architecture</option>
          <option value="Data & AI">Data Science & AI</option>
          <option value="Software Engineering">Software Engineering</option>
          <option value="Networks & Security">Networks & Security</option>
          <option value="Theory of Computation">Theory of Computation</option>
        </select>

        <select id="subtopicFilter" onchange="handleSubtopicChange()" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
          <option value="All">All Subtopics</option>
        </select>
      </div>

      <div class="flex flex-wrap items-center bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs w-full xl:w-auto">
        <button onclick="setSourceFilter('All')" id="src-All" class="src-btn bg-indigo-600 text-white px-3 py-1.5 rounded-lg transition font-medium">All Sources</button>
        <button onclick="setSourceFilter('university')" id="src-university" class="src-btn text-slate-400 hover:text-white px-3 py-1.5 rounded-lg transition font-medium">University (MIT/Stanford/CMU)</button>
        <button onclick="setSourceFilter('youtube')" id="src-youtube" class="src-btn text-slate-400 hover:text-white px-3 py-1.5 rounded-lg transition font-medium">YouTube / Creators</button>
        <button onclick="setSourceFilter('web')" id="src-web" class="src-btn text-slate-400 hover:text-white px-3 py-1.5 rounded-lg transition font-medium">Web / Interactive</button>
      </div>
    </div>

    <div class="flex justify-between items-center mb-6 text-sm text-slate-400 border-b border-slate-800 pb-4">
      <div>Displaying <span id="courseCount" class="font-bold text-white">0</span> courses</div>
      <button onclick="resetFilters()" class="text-indigo-400 hover:text-indigo-300 flex items-center gap-1 text-xs transition">
        <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Clear Filters
      </button>
    </div>

    <!-- Courses Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="coursesGrid">
      <!-- Dynamic rendering -->
    </div>
  </main>

  <script>
    const API_BASE_URL = "/api/courses"; // Replace with real API
    let database = [];
    let currentCategory = "All";
    let currentSubtopic = "All";
    let currentSource = "All";
    let debounceTimer = null;

    // The Vast CS Category Taxonomy
    const subtopicsByCategory = {
      "Computer Science Core": ["Intro to Programming", "Data Structures", "Algorithms", "Object-Oriented Programming"],
      "Mathematics for CS": ["Discrete Mathematics", "Linear Algebra", "Calculus", "Probability & Statistics"],
      "Systems & Architecture": ["Computer Architecture", "Operating Systems", "Distributed Systems", "Databases (Internals)", "Compilers"],
      "Data & AI": ["Machine Learning", "Deep Learning", "Natural Language Processing", "Computer Vision", "Data Science"],
      "Software Engineering": ["Web Development", "Mobile Development", "DevOps & Cloud", "Software Architecture"],
      "Networks & Security": ["Computer Networks", "Cryptography", "Penetration Testing", "Web Security"],
      "Theory of Computation": ["Automata Theory", "Formal Languages", "Complexity Theory"]
    };

    // The Massive Curriculum Database
    const fallbackDatabase = [
      // --- CORE & PROGRAMMING ---
      {
        id: 1, title: "CS50x: Introduction to Computer Science", category: "Computer Science Core", subtopic: "Intro to Programming",
        provider: "Harvard University", type: "university", url: "https://cs50.harvard.edu/x/", level: "Beginner",
        description: "Harvard's legendary introduction to the intellectual enterprises of computer science and the art of programming.", tags: ["C", "Python", "SQL", "Web"]
      },
      {
        id: 2, title: "MIT 6.0001: Intro to CS and Programming in Python", category: "Computer Science Core", subtopic: "Intro to Programming",
        provider: "MIT OpenCourseWare", type: "university", url: "https://ocw.mit.edu/courses/6-0001-introduction-to-computer-science-and-programming-in-python-fall-2016/", level: "Beginner",
        description: "Designed to help people with no prior exposure to computer science learn to think computationally and write programs.", tags: ["Python", "Computation"]
      },
      {
        id: 3, title: "MIT 6.006: Introduction to Algorithms", category: "Computer Science Core", subtopic: "Algorithms",
        provider: "MIT OpenCourseWare", type: "university", url: "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/", level: "Intermediate",
        description: "Mathematical modeling of computational problems, common algorithms, algorithmic paradigms, and data structures.", tags: ["Sorting", "Graphs", "Dynamic Programming"]
      },
      {
        id: 4, title: "Algorithms, Part I & II", category: "Computer Science Core", subtopic: "Data Structures",
        provider: "Princeton University", type: "university", url: "https://www.coursera.org/learn/algorithms-part1", level: "Intermediate",
        description: "Essential information that every serious programmer needs to know about algorithms and data structures.", tags: ["Java", "Trees", "Graphs"]
      },

      // --- MATHEMATICS FOR CS ---
      {
        id: 5, title: "MIT 6.042J: Mathematics for Computer Science", category: "Mathematics for CS", subtopic: "Discrete Mathematics",
        provider: "MIT OpenCourseWare", type: "university", url: "https://ocw.mit.edu/courses/6-042j-mathematics-for-computer-science-fall-2015/", level: "Undergraduate",
        description: "Elementary discrete mathematics for computer science and engineering. Proofs, logic, induction, graph theory.", tags: ["Logic", "Proofs", "Graphs"]
      },
      {
        id: 6, title: "MIT 18.06: Linear Algebra", category: "Mathematics for CS", subtopic: "Linear Algebra",
        provider: "Gilbert Strang (MIT)", type: "university", url: "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/", level: "Undergraduate",
        description: "The most famous linear algebra course in the world. Essential for understanding machine learning and graphics.", tags: ["Matrices", "Vectors", "Math"]
      },
      {
        id: 7, title: "Harvard Stat 110: Probability", category: "Mathematics for CS", subtopic: "Probability & Statistics",
        provider: "Harvard University", type: "university", url: "https://statistics.fas.harvard.edu/pages/stat-110", level: "Undergraduate",
        description: "Comprehensive introduction to probability as a language and set of tools for understanding statistics and randomness.", tags: ["Statistics", "Markov Chains"]
      },

      // --- SYSTEMS & ARCHITECTURE ---
      {
        id: 8, title: "Nand to Tetris (Build a Modern Computer)", category: "Systems & Architecture", subtopic: "Computer Architecture",
        provider: "Hebrew University", type: "web", url: "https://www.nand2tetris.org/", level: "Intermediate",
        description: "Build a modern computer system from the ground up, starting with simple logic gates and ending with an OS.", tags: ["Hardware", "Assembly", "OS"]
      },
      {
        id: 9, title: "CMU 15-213: Introduction to Computer Systems", category: "Systems & Architecture", subtopic: "Computer Architecture",
        provider: "Carnegie Mellon", type: "university", url: "https://www.cs.cmu.edu/~213/", level: "Advanced",
        description: "How computer systems execute programs, store information, and communicate. The 'programmer's perspective'.", tags: ["C", "Assembly", "Memory"]
      },
      {
        id: 10, title: "MIT 6.828: Operating System Engineering", category: "Systems & Architecture", subtopic: "Operating Systems",
        provider: "MIT OpenCourseWare", type: "university", url: "https://pdos.csail.mit.edu/6.828/", level: "Advanced",
        description: "Fundamentals of OS design and implementation. Includes building a small OS kernel (xv6) in C.", tags: ["C", "Kernel", "OS"]
      },
      {
        id: 11, title: "MIT 6.824: Distributed Systems", category: "Systems & Architecture", subtopic: "Distributed Systems",
        provider: "MIT OpenCourseWare", type: "university", url: "https://pdos.csail.mit.edu/6.824/", level: "Advanced",
        description: "Abstractions and implementation techniques for engineering distributed systems. Fault tolerance, consensus (Raft).", tags: ["Go", "Raft", "MapReduce"]
      },
      {
        id: 12, title: "CMU 15-445: Database Systems", category: "Systems & Architecture", subtopic: "Databases (Internals)",
        provider: "Carnegie Mellon", type: "university", url: "https://15445.courses.cs.cmu.edu/", level: "Advanced",
        description: "Design and implementation of database management systems. Storage, indexing, query execution, concurrency control.", tags: ["C++", "SQL", "DBMS"]
      },
      {
        id: 13, title: "Stanford CS143: Compilers", category: "Systems & Architecture", subtopic: "Compilers",
        provider: "Stanford University", type: "university", url: "https://online.stanford.edu/courses/soe-ycscs1-compilers", level: "Advanced",
        description: "Principles and practices for design and implementation of compilers and interpreters.", tags: ["Parsing", "Lexical Analysis"]
      },

      // --- DATA & AI ---
      {
        id: 14, title: "Stanford CS229: Machine Learning", category: "Data & AI", subtopic: "Machine Learning",
        provider: "Stanford University", type: "university", url: "https://cs229.stanford.edu/", level: "Advanced",
        description: "The definitive machine learning course covering theoretical foundations of supervised and unsupervised learning.", tags: ["Math", "Algorithms", "AI"]
      },
      {
        id: 15, title: "Fast.ai: Practical Deep Learning for Coders", category: "Data & AI", subtopic: "Deep Learning",
        provider: "Fast.ai", type: "web", url: "https://course.fast.ai/", level: "Intermediate",
        description: "A top-down approach to deep learning. Build state-of-the-art models for vision, text, and tabular data quickly.", tags: ["PyTorch", "Deep Learning"]
      },
      {
        id: 16, title: "Stanford CS224N: NLP with Deep Learning", category: "Data & AI", subtopic: "Natural Language Processing",
        provider: "Stanford University", type: "university", url: "https://web.stanford.edu/class/cs224n/", level: "Advanced",
        description: "Cutting-edge research in Natural Language Processing, focusing on neural network models like Transformers and LLMs.", tags: ["LLMs", "Transformers", "NLP"]
      },
      {
        id: 17, title: "Stanford CS231n: Deep Learning for Computer Vision", category: "Data & AI", subtopic: "Computer Vision",
        provider: "Stanford University", type: "university", url: "http://cs231n.stanford.edu/", level: "Advanced",
        description: "Deep learning architectures for image classification, object detection, and visual recognition.", tags: ["CNNs", "Vision", "PyTorch"]
      },

      // --- SOFTWARE ENGINEERING ---
      {
        id: 18, title: "The Odin Project", category: "Software Engineering", subtopic: "Web Development",
        provider: "Open Source", type: "web", url: "https://www.theodinproject.com/", level: "Beginner to Pro",
        description: "A complete, free open source coding curriculum for full-stack web development using Ruby on Rails or NodeJS.", tags: ["JavaScript", "React", "Node"]
      },
      {
        id: 19, title: "Full Stack Open", category: "Software Engineering", subtopic: "Web Development",
        provider: "University of Helsinki", type: "university", url: "https://fullstackopen.com/en/", level: "Intermediate",
        description: "Deep dive into modern web development with React, Redux, Node.js, MongoDB, GraphQL and TypeScript.", tags: ["React", "TypeScript", "GraphQL"]
      },
      {
        id: 20, title: "TechWorld with Nana: DevOps Bootcamp", category: "Software Engineering", subtopic: "DevOps & Cloud",
        provider: "Nana (YouTube)", type: "youtube", url: "https://www.youtube.com/c/TechWorldwithNana", level: "Beginner to Pro",
        description: "Extensive tutorials on Docker, Kubernetes, CI/CD, Jenkins, and Terraform for modern deployment infrastructure.", tags: ["Docker", "Kubernetes", "AWS"]
      },
      {
        id: 21, title: "Android Basics in Kotlin", category: "Software Engineering", subtopic: "Mobile Development",
        provider: "Google (Web)", type: "web", url: "https://developer.android.com/courses/android-basics-kotlin/course", level: "Beginner",
        description: "Official Google course on building Android applications using Kotlin and Jetpack Compose.", tags: ["Kotlin", "Android", "Mobile"]
      },

      // --- NETWORKS & SECURITY ---
      {
        id: 22, title: "Computer Networking: A Top-Down Approach", category: "Networks & Security", subtopic: "Computer Networks",
        provider: "Kurose & Ross (YouTube)", type: "youtube", url: "https://www.youtube.com/playlist?list=PLawfWYMUziZqyCG5TesrmFM73a55SRgPG", level: "Undergraduate",
        description: "Lectures based on the famous networking textbook, covering Application to Physical layers.", tags: ["TCP/IP", "DNS", "Routing"]
      },
      {
        id: 23, title: "Cryptography I", category: "Networks & Security", subtopic: "Cryptography",
        provider: "Stanford / Dan Boneh", type: "university", url: "https://www.coursera.org/learn/crypto", level: "Advanced",
        description: "Inner workings of cryptographic systems and how to correctly use them in real-world applications.", tags: ["Math", "Security", "Encryption"]
      },
      {
        id: 24, title: "Web Security Academy", category: "Networks & Security", subtopic: "Web Security",
        provider: "PortSwigger", type: "web", url: "https://portswigger.net/web-security", level: "Intermediate",
        description: "Free, interactive training on web security vulnerabilities (SQLi, XSS, CSRF) by the creators of Burp Suite.", tags: ["Penetration Testing", "Burp Suite"]
      },
      {
        id: 25, title: "MIT 6.858: Computer Systems Security", category: "Networks & Security", subtopic: "Web Security",
        provider: "MIT OpenCourseWare", type: "university", url: "https://css.csail.mit.edu/6.858/2022/", level: "Advanced",
        description: "Design and implementation of secure computer systems. Threat models, buffer overflows, privilege separation.", tags: ["Security", "Systems"]
      },

      // --- THEORY OF COMPUTATION ---
      {
        id: 26, title: "Introduction to Theory of Computation", category: "Theory of Computation", subtopic: "Automata Theory",
        provider: "Michael Sipser (MIT)", type: "university", url: "https://ocw.mit.edu/courses/18-404j-theory-of-computation-fall-2020/", level: "Advanced",
        description: "Automata, computability, and complexity. Turing machines, P vs NP, decidability.", tags: ["Math", "Turing Machines", "P vs NP"]
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      populateSubtopics();
      fetchCoursesFromAPI();
      lucide.createIcons();
    });

    async function fetchCoursesFromAPI() {
      showLoadingSkeletons();
      const searchVal = document.getElementById('searchInput').value;
      const params = new URLSearchParams();
      if (currentCategory !== "All") params.append("category", currentCategory);
      if (currentSubtopic !== "All") params.append("subtopic", currentSubtopic);
      if (currentSource !== "All") params.append("type", currentSource);
      if (searchVal.trim() !== "") params.append("q", searchVal.trim());

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000); // 4-second timeout for cloud connection

        // FIX: Attach query parameters to the API request so search and filters work!
        const queryString = params.toString() ? `?${params.toString()}` : '';
        const response = await fetch(`${API_BASE_URL}${queryString}`);        
        
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error();
        
        const result = await response.json();
        database = Array.isArray(result) ? result : (result.courses || result.data || []);      
      } catch (err) {
        // Fallback filter if API connection drops
        database = fallbackDatabase.filter(course => {
          const matchCat = currentCategory === "All" || course.category === currentCategory;
          const matchSub = currentSubtopic === "All" || course.subtopic === currentSubtopic;
          const matchSrc = currentSource === "All" || course.type === currentSource;
          const matchQ = searchVal === "" || 
                         course.title.toLowerCase().includes(searchVal.toLowerCase()) || 
                         course.provider.toLowerCase().includes(searchVal.toLowerCase()) ||
                         course.description.toLowerCase().includes(searchVal.toLowerCase());
          return matchCat && matchSub && matchSrc && matchQ;
        });
      } finally {
        renderCourses();
      }
    }
      
    function showLoadingSkeletons() {
      const grid = document.getElementById('coursesGrid');
      grid.innerHTML = Array(8).fill(0).map(() => `
        <div class="bg-slate-800/30 border border-slate-800 rounded-2xl p-5 animate-pulse flex flex-col justify-between h-[340px]">
          <div><div class="h-4 w-24 bg-slate-700/50 rounded mb-4"></div><div class="h-6 w-full bg-slate-700/50 rounded mb-3"></div><div class="h-16 w-full bg-slate-700/50 rounded mb-4"></div></div>
          <div class="h-10 w-full bg-slate-700/50 rounded-xl"></div>
        </div>
      `).join('');
    }

    function handleCategoryChange() {
      currentCategory = document.getElementById('categoryFilter').value;
      currentSubtopic = "All";
      populateSubtopics();
      fetchCoursesFromAPI();
    }

    function handleSubtopicChange() {
      currentSubtopic = document.getElementById('subtopicFilter').value;
      fetchCoursesFromAPI();
    }

    function handleSearchInput() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => fetchCoursesFromAPI(), 300);
    }

    function populateSubtopics() {
      const subSelect = document.getElementById('subtopicFilter');
      subSelect.innerHTML = `<option value="All">All Subtopics</option>`;
      if (currentCategory !== "All" && subtopicsByCategory[currentCategory]) {
        subtopicsByCategory[currentCategory].forEach(sub => {
          subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
        });
      }
    }

    function setSourceFilter(type) {
      currentSource = type;
      document.querySelectorAll('.src-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('text-slate-400');
      });
      document.getElementById(`src-${type}`).classList.add('bg-indigo-600', 'text-white');
      document.getElementById(`src-${type}`).classList.remove('text-slate-400');
      fetchCoursesFromAPI();
    }

    function resetFilters() {
      currentCategory = "All";
      currentSubtopic = "All";
      currentSource = "All";
      document.getElementById('categoryFilter').value = "All";
      document.getElementById('searchInput').value = "";
      setSourceFilter('All');
      populateSubtopics();
      fetchCoursesFromAPI();
    }

    function renderCourses() {
      const grid = document.getElementById('coursesGrid');
      document.getElementById('courseCount').innerText = database.length;

      if (database.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-20 bg-slate-800/30 border border-dashed border-slate-800 rounded-2xl">
            <i data-lucide="ghost" class="w-12 h-12 text-slate-500 mx-auto mb-3"></i>
            <h3 class="text-lg font-semibold text-slate-300">No courses match your criteria</h3>
          </div>`;
        lucide.createIcons();
        return;
      }

      grid.innerHTML = database.map(course => {
        let badgeColor = course.type === "university" ? "bg-blue-500/10 text-blue-400 border-blue-500/20" : 
                         course.type === "youtube" ? "bg-red-500/10 text-red-400 border-red-500/20" : 
                         "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
        let typeIcon = course.type === "university" ? "landmark" : course.type === "youtube" ? "video" : "monitor";

        return `
          <div class="bg-slate-800/40 border border-slate-800 hover:border-indigo-500/50 rounded-2xl p-5 transition flex flex-col justify-between group hover:shadow-2xl hover:shadow-indigo-500/10 h-full">
            <div>
              <div class="flex items-center justify-between mb-4">
                <span class="px-2.5 py-1 rounded-md border text-xs font-medium flex items-center gap-1.5 ${badgeColor}">
                  <i data-lucide="${typeIcon}" class="w-3.5 h-3.5"></i> ${course.provider}
                </span>
                <span class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">${course.level}</span>
              </div>
              <h3 class="font-bold text-[17px] leading-snug text-slate-100 group-hover:text-indigo-400 transition mb-2">
                ${course.title}
              </h3>
              <div class="text-xs text-indigo-400/80 font-medium mb-3 flex flex-wrap items-center gap-1.5">
                <span>${course.category}</span>
                <span class="text-slate-600">•</span>
                <span class="text-slate-300">${course.subtopic}</span>
              </div>
              <p class="text-sm text-slate-400 line-clamp-3 mb-5 leading-relaxed">
                ${course.description}
              </p>
            </div>
            <div class="mt-auto pt-4 border-t border-slate-800/50">
              <div class="flex flex-wrap gap-1.5 mb-4">
                ${course.tags.map(t => `<span class="px-2 py-0.5 rounded bg-slate-900 border border-slate-800 text-[10px] text-slate-400 uppercase tracking-wide">${t}</span>`).join('')}
              </div>
              <a href="${course.url}" target="_blank" rel="noopener noreferrer" 
                 class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600/10 hover:bg-indigo-600 text-indigo-300 hover:text-white font-medium text-sm py-2.5 rounded-xl transition border border-indigo-500/20 hover:border-indigo-500">
                Access Resource <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }
  </script>
</body>
</html>
